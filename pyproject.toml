[project]
name = "vigmykd"
version = "0.1.0"
description = "very intense game makes your keyboard die"
authors = [
    { name = "discocat", email = "vigmykd@runderscore.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.0",
    "protobuf>=7.35.0",
    "httpx>=0.28.1",
    "jwt>=1.4.0"
]
license = { file = "LICENSE" }

[project.optional-dependencies]
dev = [
    "flake8>=6.0",
    "mypy>=1.0",
    "pytest>=9.0.2"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.mypy]
disable_error_code = "name-defined"
